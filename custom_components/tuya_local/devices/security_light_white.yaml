name: PIR floodlight
products:
  - id: hhlk7fgmxl5n7fhx
    model: "58185"
    name: Security Light - White
entities:
  - entity: light
    icon: "mdi:light-flood-down"
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 22
        name: brightness
        type: integer
        range:
          min: 10
          max: 1000
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        name: second
        type: integer
        optional: true
        range:
          min: 0
          max: 86400
  - entity: switch
    name: Manual mode
    category: config
    dps:
      - id: 51
        type: string
        name: switch
        mapping:
          - dps_val: auto
            value: false
          - dps_val: manual
            value: true
  - entity: event
    class: motion
    dps:
      - id: 52
        type: string
        name: event
        mapping:
          - dps_val: pir
            value: detected
          - dps_val: none
            value: clear
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 54
        type: string
        name: option
        mapping:
          - dps_val: "high"
            value: high
          - dps_val: "middle"
            value: medium
          - dps_val: "low"
            value: low
  - entity: number
    name: Full light duration
    category: config
    icon: "mdi:timer"
    class: duration
    dps:
      - id: 55
        name: value
        type: integer
        range:
          min: 10
          max: 3600
        unit: s
